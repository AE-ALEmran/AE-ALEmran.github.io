name: Auto-Sync Google Scholar & ResearchGate

on:
  schedule:
    # Automatically sync weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Scholar Sync Script
        run: python scripts/sync_scholar.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/initialData.ts src/data/scholarData.json
          if git diff --staged --quiet; then
            echo "No changes detected. Scholar profile is already up to date."
          else
            git commit -m "chore(scholar): auto-sync publications and citation metrics from Google Scholar"
            git push origin main
          fi
